{% extends "customer_portal/base.html" %}

{% block title %}Your Cart{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
        <h1 class="h4 mb-1">Your cart</h1>
        <p class="text-muted small mb-0">
            Prices and totals below are previews only. Final amounts are calculated at checkout.
        </p>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <a href="{% url 'catalog:public_product_list' %}" class="btn btn-outline-primary btn-sm">Continue shopping</a>
    </div>
</div>

<div id="cartContent">
    {% include "cart/includes/_cart_content.html" %}
</div>
{% endblock %}
