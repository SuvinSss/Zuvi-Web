name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Django tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zuvi_ci
          POSTGRES_PASSWORD: zuvi_ci
          POSTGRES_DB: zuvi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuvi_ci -d zuvi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key-not-used-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://zuvi_ci:zuvi_ci@127.0.0.1:5432/zuvi_ci
      DB_CONN_MAX_AGE: "0"
      DB_SSL_REQUIRE: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Full test suite (PostgreSQL)
        run: python manage.py test --verbosity 2

      - name: Concurrency test classes (serial)
        run: |
          python manage.py test --verbosity 2 --parallel 1 \
            inventory.tests.InventoryConcurrencyTests \
            inventory.tests_stock_integrity.StockIntegrityConcurrencyTests \
            orders.tests_checkout_service.CheckoutServiceConcurrencyTests
