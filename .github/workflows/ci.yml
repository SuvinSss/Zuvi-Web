name: CI

on:
  pull_request:
  push:
    branches: [main, uat]

permissions:
  contents: read

jobs:
  test:
    name: Django tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zuvi_ci
          POSTGRES_PASSWORD: zuvi_ci
          POSTGRES_DB: zuvi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuvi_ci -d zuvi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key-not-used-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://zuvi_ci:zuvi_ci@127.0.0.1:5432/zuvi_ci
      DB_CONN_MAX_AGE: "0"
      DB_SSL_REQUIRE: "False"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Production-style deployment check (synthetic configuration)
        env:
          DJANGO_ENVIRONMENT: production
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: ci.example.test,healthcheck.railway.app
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.test
          DJANGO_TRUST_PROXY_SSL_HEADER: "True"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DJANGO_SECURE_HSTS_SECONDS: "0"
          MEDIA_STORAGE_BACKEND: s3
          MEDIA_BUCKET_NAME: example-ci-media
          MEDIA_REGION_NAME: ap-south-1
          MEDIA_ACCESS_KEY_ID: EXAMPLE_ONLY
          MEDIA_SECRET_ACCESS_KEY: EXAMPLE_ONLY
        run: |
          python - <<'PY'
          import os
          import secrets
          import subprocess
          import sys

          # Ephemeral secret for this process and its child only; never printed.
          os.environ['DJANGO_SECRET_KEY'] = secrets.token_urlsafe(64)
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          # DATABASE_URL remains the job's local PostgreSQL CI service URL.
          subprocess.run([sys.executable, 'manage.py', 'check', '--deploy'], check=True)

          import django
          django.setup()
          from django.conf import settings
          from django.core import checks

          # The command above prints all diagnostics. Permit only the intentional
          # zero-HSTS warning; Django's default ERROR threshold alone is too lax.
          unexpected = [
              issue for issue in checks.run_checks(include_deployment_checks=True)
              if issue.level >= checks.WARNING and not (
                  issue.id == 'security.W004' and settings.SECURE_HSTS_SECONDS == 0
              )
          ]
          if unexpected:
              raise SystemExit('\n'.join(str(issue) for issue in unexpected))
          PY

      - name: Isolated static build
        env:
          DJANGO_STATIC_ROOT: ${{ runner.temp }}/zuvi-static
        run: python scripts/collectstatic.py

      - name: Verify migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Full test suite (PostgreSQL)
        run: python manage.py test --verbosity 2

      - name: Concurrency test classes (serial)
        run: |
          python manage.py test --verbosity 2 --parallel 1 \
            inventory.tests.InventoryConcurrencyTests \
            inventory.tests_stock_integrity.StockIntegrityConcurrencyTests \
            orders.tests_checkout_service.CheckoutServiceConcurrencyTests \
            catalog.tests_image_workflow.ImageConcurrencyTests
