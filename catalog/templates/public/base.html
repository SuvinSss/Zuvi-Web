<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title|default:"Zoop" }}{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <style>
        :root {
            --zoop-ink: #1a2e1f;
            --zoop-leaf: #2f6b4f;
            --zoop-mist: #f3f7f4;
            --zoop-sun: #e8b86d;
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(232, 184, 109, 0.18), transparent 40%),
                linear-gradient(180deg, #f7faf8 0%, var(--zoop-mist) 100%);
            color: var(--zoop-ink);
            min-height: 100vh;
        }
        .shop-nav {
            background: rgba(26, 46, 31, 0.94);
        }
        .product-card {
            border: 0;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 10px 30px rgba(26, 46, 31, 0.06);
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(26, 46, 31, 0.1);
        }
        .product-card img {
            height: 180px;
            object-fit: cover;
            width: 100%;
            background: #e7eee9;
        }
        .price-now { color: var(--zoop-leaf); font-weight: 700; }
        .price-was { text-decoration: line-through; color: #6c757d; }
        .hero-brand {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--zoop-ink);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shop-nav mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'catalog:public_home' %}">Zoop</a>
        <div class="d-flex align-items-center gap-2 ms-auto">
            <a class="btn btn-outline-light btn-sm" href="{% url 'catalog:public_product_list' %}">Products</a>
            {% if request.user.is_authenticated and request.user.role == "CUSTOMER" %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'cart:cart_detail' %}">Cart</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'customers:customer_portal_dashboard' %}">Account</a>
            {% else %}
                <a class="btn btn-light btn-sm" href="{% url 'customers:customer_portal_login' %}">Customer login</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
