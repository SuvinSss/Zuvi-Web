{% extends "customer_portal/base.html" %}
{% block title %}Choose a new password · ZuuVi{% endblock %}
{% block content %}<section class="auth-recovery"><h1>Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-brand" type="submit">Save password</button></form>{% else %}<p>This reset link is invalid or has expired.</p><a href="{% url 'customers:password_reset' %}">Request a new link</a>{% endif %}</section>{% endblock %}
