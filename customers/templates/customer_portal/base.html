<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zoop Customer{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
</head>
<body class="bg-light">
{% if request.user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'customers:customer_portal_dashboard' %}">Customer Portal</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="{% url 'customers:customer_portal_dashboard' %}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="{% url 'orders:customer_order_list' %}" class="btn btn-outline-light btn-sm">Orders</a>
            <a href="{% url 'cart:cart_detail' %}" class="btn btn-outline-light btn-sm">Cart</a>
            <a href="{% url 'customers:customer_portal_profile' %}" class="btn btn-outline-light btn-sm">Profile</a>
            <a href="{% url 'customers:customer_portal_address_list' %}" class="btn btn-outline-light btn-sm">Addresses</a>
            <form method="post" action="{% url 'customers:customer_portal_logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
{% endif %}
<main class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
